name: CI (windows)

# 最小质量门: 等效于本仓 pre-push 钩子(npm test)上云。GodfreyHub 被家族仓按
# runnerSurfaceHash 逐字节钉定, 地基红而无人知是结构性风险——这里就是哨。
# pwsh 腿测试依赖 PowerShell 7(windows runner 预装); 缺 jieba 等环境件的测试
# 经 tests/env-guard.mjs 自动 skip, 不塞假绿也不环境红。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: npm build + test (windows)
    # windows-2022 而非 windows-latest: latest 已指 VS2026(v18) 镜像, better-sqlite3 的
    # node-gyp(10/11)不识别该版本 → 源编译必死; 2022 镜像的 VS2022(v17)可被识别。
    # (node 20 + 预编译也不可行: better-sqlite3 13 的 install 脚本就是 node-gyp rebuild,
    #  首跑/二跑实测两次撞死在源编译, 见 run 37071501907 / 37073818601。)
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 20: better-sqlite3 需原生模块, runner 预装 VS18 太新(node-gyp 11.5 不识别),
          # 源编译必死; Node 20 走 prebuilt 二进制绕开编译。engines>=18 兼容。
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # npm test 自带 npm run build(build-stamp 确定性戳 + tsc), 显式跑一遍让编译错误
      # 在自己的步骤里红, 不与测试失败混在一起。
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # 观测面(非家族钉扎面, 见脚本头注释): 让每个 run 自报执行面指纹, 漂移可对比。
      - name: Surface manifest
        if: always()
        run: node scripts/print-surface-manifest.mjs >> "$GITHUB_STEP_SUMMARY"
